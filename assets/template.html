<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>WiFi 密码清单</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --r:16px; --r-sm:10px;
  --bg:#080d13; --bg-soft:#0c141d;
  --panel:rgba(20,30,42,.72);
  --panel-hi:rgba(30,44,60,.9);
  --line:rgba(148,183,220,.14);
  --line-hi:rgba(148,183,220,.26);
  --fg:#e9f0f8; --fg-dim:#9db0c4; --fg-mute:#6b7f95;
  --accent:#38bdf8; --accent-2:#22d3ee;
  --wpa3:#34d399; --wpa2:#60a5fa; --wpa:#fbbf24; --wep:#fb7185; --open:#94a3b8;
  --shadow:0 18px 48px -22px rgba(0,0,0,.85);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI Variable Display","Segoe UI","Leelawadee UI","Microsoft YaHei UI","Microsoft YaHei","Noto Sans Thai",system-ui,-apple-system,sans-serif;
}
html[data-theme="light"]{
  --bg:#eef3f9; --bg-soft:#e4ecf5;
  --panel:rgba(255,255,255,.86);
  --panel-hi:#ffffff;
  --line:rgba(23,58,94,.13);
  --line-hi:rgba(23,58,94,.24);
  --fg:#0f2438; --fg-dim:#4a6480; --fg-mute:#7890a8;
  --accent:#0284c7; --accent-2:#0891b2;
  --wpa3:#059669; --wpa2:#2563eb; --wpa:#b45309; --wep:#e11d48; --open:#64748b;
  --shadow:0 16px 40px -24px rgba(20,50,90,.35);
}
@media (prefers-color-scheme:light){
  html[data-theme="auto"]{
    --bg:#eef3f9; --bg-soft:#e4ecf5;
    --panel:rgba(255,255,255,.86); --panel-hi:#ffffff;
    --line:rgba(23,58,94,.13); --line-hi:rgba(23,58,94,.24);
    --fg:#0f2438; --fg-dim:#4a6480; --fg-mute:#7890a8;
    --accent:#0284c7; --accent-2:#0891b2;
    --wpa3:#059669; --wpa2:#2563eb; --wpa:#b45309; --wep:#e11d48; --open:#64748b;
    --shadow:0 16px 40px -24px rgba(20,50,90,.35);
  }
}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; padding:0 0 64px;
  font-family:var(--sans); font-size:14px; line-height:1.55;
  color:var(--fg); background:var(--bg);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(760px 420px at 8% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%),
    radial-gradient(680px 460px at 92% 2%, color-mix(in srgb, var(--accent-2) 13%, transparent), transparent 62%),
    radial-gradient(900px 620px at 50% 110%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%);
}
.wrap{max-width:1240px; margin:0 auto; padding:0 26px}

/* ---------- header ---------- */
header{padding:34px 0 20px}
.hd{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:14px; min-width:0; flex:1}
.mark{
  width:46px;height:46px; flex:0 0 46px; border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  box-shadow:0 10px 26px -12px color-mix(in srgb, var(--accent) 70%, transparent);
}
.mark svg{width:24px;height:24px;stroke:#02121c;stroke-width:2.1;fill:none;stroke-linecap:round}
h1{margin:0; font-size:23px; font-weight:650; letter-spacing:-.35px}
.sub{margin:3px 0 0; font-size:12.5px; color:var(--fg-mute); font-family:var(--mono); letter-spacing:-.1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sub b{color:var(--fg-dim); font-weight:600}
.tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
button{font-family:inherit; font-size:12.5px; cursor:pointer; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--fg-dim); padding:8px 13px; display:inline-flex; align-items:center; gap:7px;
  transition:border-color .16s, color .16s, background .16s, transform .1s; backdrop-filter:blur(8px)}
button:hover{border-color:var(--line-hi); color:var(--fg); background:var(--panel-hi)}
button:active{transform:translateY(1px)}
button svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
button.primary{background:linear-gradient(150deg,var(--accent),var(--accent-2)); border-color:transparent; color:#03131d; font-weight:640}
button.primary:hover{filter:brightness(1.06); color:#03131d}

/* language switch */
.langs{display:inline-flex; align-items:stretch; border:1px solid var(--line); border-radius:10px;
  overflow:hidden; background:var(--panel); backdrop-filter:blur(8px); height:32px}
.langs button{border:0; border-radius:0; padding:0 11px; height:100%; background:transparent;
  color:var(--fg-mute); font-size:12px; gap:0}
.langs button+button{border-left:1px solid var(--line)}
.langs button:hover{background:color-mix(in srgb, var(--fg) 7%, transparent); color:var(--fg)}
.langs button.on{background:color-mix(in srgb, var(--accent) 17%, transparent);
  color:color-mix(in srgb, var(--accent) 90%, var(--fg)); font-weight:640}

/* ---------- notice ---------- */
.notice{
  margin:0 0 22px; padding:11px 15px; border-radius:var(--r-sm);
  display:flex; gap:10px; align-items:flex-start;
  background:color-mix(in srgb, var(--wpa) 11%, transparent);
  border:1px solid color-mix(in srgb, var(--wpa) 30%, transparent);
  color:color-mix(in srgb, var(--wpa) 82%, var(--fg));
  font-size:12.5px; line-height:1.5;
}
.notice svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.notice b{font-weight:640}

/* ---------- stats ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:13px; margin-bottom:14px}
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; position:relative; overflow:hidden; backdrop-filter:blur(10px);
  box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.stat::after{content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 55%,transparent),transparent)}
.stat .k{font-size:11.5px; color:var(--fg-mute); letter-spacing:.3px; display:flex; align-items:center; gap:6px}
.stat .k svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.stat .v{font-size:30px; font-weight:660; letter-spacing:-1.2px; margin-top:5px; font-variant-numeric:tabular-nums; line-height:1.1}
.stat .v small{font-size:13px; font-weight:500; color:var(--fg-mute); letter-spacing:0; margin-left:4px}
.stat .n{font-size:11.5px; color:var(--fg-mute); margin-top:2px}
.split{display:flex; height:5px; border-radius:3px; overflow:hidden; margin-top:auto; padding-top:0; background:var(--line); gap:1.5px}
.split i{display:block; height:100%}
.lg{font-size:10.5px; color:var(--fg-mute); margin-top:5px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- current ---------- */
.current{
  display:flex; align-items:center; gap:24px; flex-wrap:wrap;
  background:linear-gradient(150deg, color-mix(in srgb,var(--accent) 9%, var(--panel)), var(--panel));
  border:1px solid var(--line-hi); border-radius:var(--r);
  padding:20px 24px; margin-bottom:26px; box-shadow:var(--shadow); backdrop-filter:blur(10px);
}
.current.off{background:var(--panel)}
.ring{position:relative; width:88px; height:88px; flex:0 0 88px}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .bg{stroke:var(--line-hi)}
.ring .val{stroke:url(#g1); transition:stroke-dashoffset .8s cubic-bezier(.3,1,.4,1)}
.ring .pct{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  font-size:19px; font-weight:660; letter-spacing:-.6px; font-variant-numeric:tabular-nums;
}
.ring .pct em{display:block; font-style:normal; font-size:9.5px; font-weight:500; color:var(--fg-mute); letter-spacing:.6px; margin-top:1px}
.cur-main{min-width:210px; flex:1}
.cur-main .lbl{font-size:11px; letter-spacing:1.1px; text-transform:uppercase; color:var(--fg-mute); font-weight:600}
.cur-main .ssid{font-size:21px; font-weight:650; letter-spacing:-.4px; margin-top:2px; word-break:break-all; line-height:1.25}
.cur-main .mac{font-family:var(--mono); font-size:11.5px; color:var(--fg-mute); margin-top:3px}
.cur-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 26px; flex:1.5; min-width:320px}
.cg{min-width:0}
.cg .k{font-size:10.5px; letter-spacing:.6px; color:var(--fg-mute); text-transform:uppercase}
.cg .v{font-size:13px; font-family:var(--mono); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- toolbar ---------- */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.search{position:relative; flex:1; min-width:200px; max-width:330px}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px;
  stroke:var(--fg-mute); stroke-width:2; fill:none; stroke-linecap:round; pointer-events:none}
.search input{
  width:100%; padding:9px 12px 9px 33px; border-radius:10px; font-family:inherit; font-size:13px;
  border:1px solid var(--line); background:var(--panel); color:var(--fg); outline:none;
  transition:border-color .16s, background .16s;
}
.search input::placeholder{color:var(--fg-mute)}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 60%, transparent); background:var(--panel-hi)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer; user-select:none;
  border:1px solid var(--line); background:transparent; color:var(--fg-dim); transition:all .16s;
}
.chip:hover{color:var(--fg); border-color:var(--line-hi)}
.chip.on{background:color-mix(in srgb,var(--accent) 17%, transparent); border-color:color-mix(in srgb,var(--accent) 55%, transparent);
  color:color-mix(in srgb,var(--accent) 88%, var(--fg)); font-weight:600}
.tally{margin-left:auto; font-size:12px; color:var(--fg-mute); font-variant-numeric:tabular-nums}
.tally b{color:var(--fg-dim); font-weight:640}

/* ---------- grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(336px,1fr)); gap:13px}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 16px; backdrop-filter:blur(10px); box-shadow:var(--shadow);
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.card:hover{border-color:var(--line-hi); transform:translateY(-2px);
  box-shadow:0 22px 52px -24px rgba(0,0,0,.8)}
.card.is-cur{border-color:color-mix(in srgb,var(--accent) 45%, transparent)}
.ch{display:flex; align-items:flex-start; gap:10px}
.ico{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 12%, transparent); border:1px solid color-mix(in srgb,var(--accent) 22%, transparent)}
.ico svg{width:16px;height:16px;stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nm{min-width:0; flex:1}
.nm .t{font-size:14.5px; font-weight:620; letter-spacing:-.2px; word-break:break-all; line-height:1.35}
.tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
.tag{font-size:10.5px; font-weight:600; letter-spacing:.25px; padding:1.5px 7px; border-radius:5px;
  border:1px solid; white-space:nowrap; line-height:1.6}
.tag.t-wpa3{color:var(--wpa3); border-color:color-mix(in srgb,var(--wpa3) 42%,transparent); background:color-mix(in srgb,var(--wpa3) 12%,transparent)}
.tag.t-wpa2{color:var(--wpa2); border-color:color-mix(in srgb,var(--wpa2) 42%,transparent); background:color-mix(in srgb,var(--wpa2) 12%,transparent)}
.tag.t-wpa{color:var(--wpa); border-color:color-mix(in srgb,var(--wpa) 42%,transparent); background:color-mix(in srgb,var(--wpa) 12%,transparent)}
.tag.t-wep{color:var(--wep); border-color:color-mix(in srgb,var(--wep) 42%,transparent); background:color-mix(in srgb,var(--wep) 12%,transparent)}
.tag.t-open{color:var(--open); border-color:color-mix(in srgb,var(--open) 42%,transparent); background:color-mix(in srgb,var(--open) 12%,transparent)}
.tag.t-mut{color:var(--fg-mute); border-color:var(--line-hi); background:transparent; font-weight:500}
.tag.t-cur{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:color-mix(in srgb,var(--accent) 15%,transparent)}
.tag.t-sig{color:var(--fg-dim); border-color:var(--line-hi); background:transparent; font-weight:600; font-variant-numeric:tabular-nums}
.tag.t-sig.weak{color:var(--fg-mute); font-weight:500}

.pw{display:flex; align-items:center; gap:7px; margin-top:12px; padding:7px 8px 7px 11px;
  border-radius:var(--r-sm); background:color-mix(in srgb,var(--fg) 5%, transparent);
  border:1px solid var(--line); min-height:38px}
.pw .val{flex:1; font-family:var(--mono); font-size:13px; letter-spacing:.4px; word-break:break-all;
  color:var(--fg); user-select:all; min-width:0}
.pw .val.hid{letter-spacing:2.4px; color:var(--fg-mute); font-size:12px}
.pw .val.none{font-family:var(--sans); font-size:12px; color:var(--fg-mute); letter-spacing:0; user-select:none}
.ib{width:27px;height:27px;flex:0 0 27px;padding:0;justify-content:center;border-radius:7px;
  border:1px solid transparent; background:transparent; color:var(--fg-mute)}
.ib:hover{background:color-mix(in srgb,var(--fg) 8%,transparent); color:var(--fg); border-color:var(--line)}
.ib svg{width:14px;height:14px}
.ib.ok{color:var(--wpa3); background:color-mix(in srgb,var(--wpa3) 14%,transparent)}

/* ---------- footer ---------- */
footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--fg-mute); display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap}
footer code{font-family:var(--mono); color:var(--fg-dim)}
.empty{grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--fg-mute); font-size:13px}
.empty svg{width:34px;height:34px;stroke:currentColor;stroke-width:1.6;fill:none;margin-bottom:10px;opacity:.6}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .cur-grid{grid-template-columns:repeat(2,minmax(0,1fr)); min-width:100%}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr); gap:9px}
  .stat .v{font-size:25px}
  h1{font-size:20px}
  .sub{font-size:11px; max-width:100%}
  .brand{gap:11px}
  .mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px}
  .mark svg{width:21px;height:21px}
  .current{padding:16px; gap:16px}
  .cur-grid{grid-template-columns:1fr 1fr; gap:9px 16px}
  .tally{margin-left:0; width:100%}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

@media print{
  :root{
    --bg:#fff; --bg-soft:#fff; --panel:#fff; --panel-hi:#fff;
    --line:#d9e0e8; --line-hi:#c3ccd8;
    --fg:#101822; --fg-dim:#3b4b5c; --fg-mute:#6b7c8f;
    --accent:#0369a1; --accent-2:#0e7490;
    --wpa3:#047857; --wpa2:#1d4ed8; --wpa:#b45309; --wep:#be123c; --open:#556072;
    --shadow:none;
  }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body{background:#fff!important; color:var(--fg)!important}
  body::before{display:none}
  body{padding:0}
  .tools,.bar,.notice,footer{display:none!important}
  .card,.stat,.current{break-inside:avoid; box-shadow:none!important; backdrop-filter:none!important;
    border:1px solid var(--line)!important; background:#fff!important}
  .pw{background:#f5f8fb!important}
  .grid{grid-template-columns:1fr 1fr}
  header{padding:0 0 12px}
  .cur-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24"><path d="M2.5 8.6a16 16 0 0 1 19 0"/><path d="M5.6 12.2a11 11 0 0 1 12.8 0"/><path d="M8.7 15.8a6 6 0 0 1 6.6 0"/><circle cx="12" cy="19.4" r="1.15" fill="currentColor" stroke="none"/></svg>
        </div>
        <div style="min-width:0">
          <h1 id="hTitle">WiFi 密码清单</h1>
          <p class="sub" id="sub"></p>
        </div>
      </div>
      <div class="tools">
        <div class="langs" id="langs"></div>
        <button id="bReveal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
          <span id="bRevealT">显示全部密码</span>
        </button>
        <button id="bTheme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button id="bPrint" class="primary">
          <svg viewBox="0 0 24 24"><path d="M6 9V3.5h12V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="2"/><path d="M6 16.5h12V21H6z"/></svg>
          <span id="bPrintT">打印</span>
        </button>
      </div>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24"><path d="M12 3.5 2.8 20h18.4L12 3.5z"/><path d="M12 9.5v4.2"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
    <div id="noticeTxt"></div>
  </div>

  <section class="stats" id="stats"></section>
  <section class="current" id="current"></section>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.6 4.6"/></svg>
      <input id="q" type="search" placeholder="搜索 WiFi 名称…" autocomplete="off" spellcheck="false">
    </div>
    <div class="chips" id="chips"></div>
    <div class="tally" id="tally"></div>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <div id="ftNote"></div>
    <div id="ftMeta"></div>
  </footer>
</div>

    if (filter === "key")  return !!n.hasKey;
    if (filter === "open") return !n.hasKey;
    if (filter === "auto") return n.mode === "auto";
    if (filter === "cur")  return !!n.cur;
    return true;
  }

  function draw(){
    // Only the signal split is done here; ties keep the order the app sent,
    // which already sorted them by name. Re-sorting by name in the browser
    // would disagree with .NET over punctuation ("3-304" vs "316投屏"), and
    // two views of the same list must not differ.
    var sorted = nets.slice().sort(function(a, b){
      var ha = a.signal != null && a.signal >= 0;
      var hb = b.signal != null && b.signal >= 0;
      if (ha !== hb) return ha ? -1 : 1;
      if (ha && a.signal !== b.signal) return b.signal - a.signal;
      return 0;
    });
    var list = sorted.filter(matches);

    var html = list.map(function(n){
      var a = authOf(n.auth);
      var tags = ['<span class="tag t-' + a.t + '">' + esc(a.l) + "</span>"];
      if (n.signal != null && n.signal >= 0) tags.push('<span class="tag t-sig' + (n.signal < 40 ? " weak" : "") + '" title="' + t("signal") + '">' + n.signal + "%</span>");
      if (n.enc && n.enc !== "none" && n.auth !== "OPEN") tags.push('<span class="tag t-mut">' + esc(n.enc) + "</span>");
      if (n.onex) tags.push('<span class="tag t-mut">802.1X</span>');
      if (n.mode === "auto") tags.push('<span class="tag t-mut">' + t("tagAuto") + "</span>");
      if (n.hidden) tags.push('<span class="tag t-mut">' + t("tagHidden") + "</span>");
      if (n.cur) tags.push('<span class="tag t-cur">' + t("tagCur") + "</span>");

      var pw;
      if (!n.hasKey) {
        pw = '<div class="pw"><span class="val none">' + t("pwNone") + "</span></div>";
      } else if (m.masked || !n.key) {
        pw = '<div class="pw"><span class="val none">' + t("pwNotExported") + "</span>" +
             '<span class="tag t-mut" style="margin-left:auto">' + t("pwMasked") + "</span></div>";
      } else {
        pw = '<div class="pw">' +
          '<span class="val' + (maskOn ? " hid" : "") + '" data-pw="' + esc(n.key) + '">' + (maskOn ? "••••••••" : esc(n.key)) + "</span>" +
          '<button class="ib" data-act="eye" title="' + t("eyeTitle") + '">' + (maskOn ? ICON_EYE : ICON_OFF) + "</button>" +
          '<button class="ib" data-act="copy" title="' + t("copyTitle") + '">' + ICON_COPY + "</button>" +
        "</div>";
      }

      return '<article class="card' + (n.cur ? " is-cur" : "") + '">' +
        '<div class="ch"><div class="ico">' + (n.hasKey ? ICON_WIFI : ICON_NONE) + "</div>" +
          '<div class="nm"><div class="t">' + esc(n.ssid) + '</div><div class="tags">' + tags.join("") + "</div></div>" +
        "</div>" + pw + "</article>";
    }).join("");

    $("#grid").innerHTML = list.length ? html :
      '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.8 4.8"/></svg>' +
      "<div>" + t("empty") + "</div></div>";

    $("#tally").innerHTML = tf("tally", list.length, nets.length);
  }

  function renderFooter(){
    $("#ftNote").innerHTML = t("footNote");
    $("#ftMeta").textContent = tf("footMeta", nets.length, m.time || "");
  }

  function renderAll(){
    renderLangBar();
    renderHeader();
    renderNotice();
    renderStats();
    renderCurrent();
    renderChips();
    renderFooter();
    draw();
  }

  /* ================= interaction ================= */

  $("#langs").addEventListener("click", function(e){
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    var next = norm(b.getAttribute("data-lang"));
    if (!next || next === LANG) return;
    LANG = next;
    try { localStorage.setItem("wifi-lang", LANG); } catch(e2){}
    renderAll();
  });

  $("#chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if (!b) return;
    filter = b.getAttribute("data-f");
    renderChips();
    draw();
  });

  $("#q").addEventListener("input", function(){
    query = this.value.trim().toLowerCase();
    draw();
  });

  $("#grid").addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var box = btn.closest(".pw"), val = box.querySelector(".val");
    if (btn.getAttribute("data-act") === "eye") {
      var hidden = val.classList.contains("hid");
      val.classList.toggle("hid", !hidden);
      val.textContent = hidden ? val.getAttribute("data-pw") : "••••••••";
      btn.innerHTML = hidden ? ICON_OFF : ICON_EYE;
      if (hidden) maskOn = false;
    } else if (btn.getAttribute("data-act") === "copy") {
      var text = val.getAttribute("data-pw");
      var done = function(){
        btn.innerHTML = ICON_OK;
        btn.classList.add("ok");
        setTimeout(function(){ btn.innerHTML = ICON_COPY; btn.classList.remove("ok"); }, 1300);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function(){ legacy(text); done(); });
      } else { legacy(text); done(); }
    }
  });

  function legacy(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  $("#bReveal").addEventListener("click", function(){
    maskOn = !maskOn;
    document.querySelectorAll(".val[data-pw]").forEach(function(v){
      v.classList.toggle("hid", maskOn);
      v.textContent = maskOn ? "••••••••" : v.getAttribute("data-pw");
    });
    document.querySelectorAll('[data-act="eye"]').forEach(function(b){
      b.innerHTML = maskOn ? ICON_EYE : ICON_OFF;
    });
    $("#bRevealT").textContent = maskOn ? t("reveal") : t("hide");
  });

  $("#bPrint").addEventListener("click", function(){ window.print(); });

  renderAll();
})();
</script>
</body>
</html>
